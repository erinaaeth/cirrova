<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA – Rise Above the Noise</title>
<meta name="description" content="A community-driven token floating above the chaos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B1B4D;
    --violet: #9268FF;
    --lilac: #D7C3FF;
    --glass: rgba(255,255,255,.18);
    --glass-line: rgba(255,255,255,.43);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #fff; background: #cdb8ec; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  /* Desktop: 1440 x 1024 frame. Every position/size below is measured from the Figma
     screenshot and written as  calc(var(--u) * N)  where N = px at 1440 wide. */
  .hero {
    --u: calc(min(100cqw, 1440px) / 1440);
    --content-inset: max(0px, calc((100cqw - 1440px) / 2));
    container-type: inline-size;
    position: relative;
    width: 100%; max-width: none; height: max(100svh, calc(100vw * 9 / 16)); min-height: 100svh;

    margin: 0 auto;
    overflow: hidden; isolation: isolate;
    background: url("bg.webp") center bottom / cover no-repeat;
  }


  .orb {
    position: absolute; z-index: -3; border-radius: 50%; pointer-events: none;
    width: calc(var(--u) * 72); height: calc(var(--u) * 72);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff 0 8%, rgba(215,195,255,.75) 18%, rgba(215,195,255,0) 70%);
  }
  .o1 { left: 30.3%; top: 17%; }
  .o2 { left: 54.9%; top: 22.8%; }
  .o3 { left: 80.9%; top: 29.5%; }

  .island {
    position: absolute; z-index: -2;
    right: 3vw; top: 8%; width: 38%; height: auto;
    animation: float 6s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes float { 0%, 100% { transform: translateY(-10px); } 50% { transform: translateY(10px); } }
  .mist { position: absolute; z-index: 1; left: 0; bottom: 0; width: 100%; max-height: 32%; object-fit: cover; object-position: bottom center; pointer-events: none; animation: mist-drift 30s ease-in-out infinite; }
  @keyframes mist-drift { 0%, 100% { transform: translateX(-20px); } 50% { transform: translateX(20px); } }


  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
  }

  /* Nav */
  .nav {
    position: absolute; z-index: 3;
    left: calc(var(--content-inset) + var(--u) * 40); right: calc(var(--content-inset) + var(--u) * 37); top: calc(var(--u) * 59);
    height: calc(var(--u) * 52);
    border-radius: 32px;
  }
  .logo { position: absolute; left: calc(var(--u) * 33); top: 50%; transform: translateY(-50%);
    font: 700 calc(var(--u) * 22)/1 'Sora', sans-serif; letter-spacing: .02em; }
  .links { position: absolute; left: calc(var(--u) * 360); top: 50%; transform: translateY(-50%);
    display: flex; gap: calc(var(--u) * 37); list-style: none; padding: 0; }
  .links li:first-child { margin-right: calc(var(--u) * 30); }
  .links a { font: 500 calc(var(--u) * 17)/1 'Inter', sans-serif; color: rgba(255,255,255,.78); transition: color .2s; }
  .links a:hover { color: #fff; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 calc(var(--u) * 16)/1 'Inter', sans-serif;
    color: #fff; cursor: pointer;
    transition: box-shadow .25s ease, filter .25s ease, transform .25s ease;
  }
  .btn:hover, .btn:focus-visible {
    filter: brightness(1.08);
    box-shadow: 0 0 0 1px rgba(255,255,255,.5), 0 0 28px 6px rgba(190,160,255,.65);
    transform: translateY(-1px);
  }
  .btn:focus-visible, .links a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn-wallet {
    position: absolute; right: calc(var(--u) * 94); top: 50%; margin-top: calc(var(--u) * -20.5);
    width: calc(var(--u) * 225); height: calc(var(--u) * 41); border-radius: 999px;
    background: rgba(255,255,255,.9); color: var(--ink);
  }
  .btn-wallet:hover { transform: none; }

  /* Hero copy */
  .copy {
    position: absolute; z-index: 2; left: calc(var(--content-inset) + var(--u) * 40); top: 50%;
    width: calc(var(--u) * 360); height: calc(var(--u) * 383);
    transform: translateY(-50%);
    background: radial-gradient(ellipse at 46% 48%, rgba(255,255,255,.16) 0%, rgba(224,211,255,.10) 48%, rgba(224,211,255,0) 76%);
    border-radius: calc(var(--u) * 32);
  }
  h1 {
    position: absolute; z-index: 3; left: 0; top: 0;
    font: 700 calc(var(--u) * 38)/calc(var(--u) * 52) 'Sora', sans-serif; letter-spacing: -.01em;
  }
  h1 span { display: block; }
  h1 .accent { color: var(--lilac); }
  .sub {
    position: absolute; z-index: 3; left: 0; top: calc(var(--u) * 166);
    width: calc(var(--u) * 330);
    font: 400 calc(var(--u) * 18)/calc(var(--u) * 27) 'Inter', sans-serif; color: #fff; text-shadow: 0 1px 8px rgba(47,25,83,.32);
  }
  .actions { display: contents; }
  .actions .btn { position: absolute; z-index: 3; top: calc(var(--u) * 259); height: calc(var(--u) * 44); border-radius: 28px; }
  .btn-primary { left: calc(var(--u) * 18); width: calc(var(--u) * 160); background: var(--violet); }
  .btn-join { left: calc(var(--u) * 196); width: calc(var(--u) * 177); color: #fff; text-shadow: 0 1px 8px rgba(47,25,83,.32); }
  .badge {
    position: absolute; z-index: 3; left: calc(var(--u) * 59); top: calc(var(--u) * 339);
    width: calc(var(--u) * 159); height: calc(var(--u) * 44); border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font: 500 calc(var(--u) * 16)/1 'Inter', sans-serif; color: rgba(255,255,255,.9);
  }

  /* Mobile: text on top, island below */
  @media (max-width: 720px) {
    .hero { aspect-ratio: auto; height: auto; min-height: 100svh; container-type: normal; display: flex; flex-direction: column; padding-bottom: 60px; }
    .nav, .logo, .links, .btn-wallet, h1, .sub, .actions .btn, .badge, .island { position: static; }
    .nav { margin: 16px 16px 0; height: 60px; padding: 0 8px 0 22px; border-radius: 28px;
      display: flex; align-items: center; justify-content: space-between; }
    .logo { transform: none; font-size: 21px; }
    .links { display: none; }
    .btn-wallet { margin: 0; width: auto; height: 44px; padding: 0 20px; font-size: 15px; }

    .copy { display: block; position: relative; z-index: 3; left: auto; top: auto; width: auto; height: auto; transform: none; background: none; padding: 44px 24px 0; }
    h1 { font-size: 48px; line-height: 1.1; }
    .sub { width: auto; max-width: 320px; margin-top: 20px; font-size: 17px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .actions .btn { height: 52px; width: auto; padding: 0 24px; font-size: 16px; border-radius: 26px; }
    .badge { display: inline-flex; width: auto; height: 40px; padding: 0 20px; margin-top: 24px; font-size: 15px; }

    .island { width: 108%; margin: 20px -4% -14% auto; align-self: flex-end; }
    .orb { width: 56px; height: 56px; }
    .o1 { left: 12%; top: 9%; } .o2 { left: 72%; top: 14%; } .o3 { left: 84%; top: 44%; }
  }
  @media (prefers-reduced-motion: reduce) { .island, .mist { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
  <main class="hero">
    <span class="orb o1" aria-hidden="true"></span>
    <span class="orb o2" aria-hidden="true"></span>
    <span class="orb o3" aria-hidden="true"></span>

    <header class="nav glass">
      <a class="logo" href="#">NOVA</a>
      <ul class="links">
        <li><a href="#explore">Explore</a></li>
        <li><a href="#tokenomics">Tokenomics</a></li>
        <li><a href="#community">Community</a></li>
        <li><a href="#about">About</a></li>
      </ul>
      <a class="btn btn-wallet" href="#wallet">Connect Wallet</a>
    </header>

    <section class="copy">
      <h1><span>Rise</span><span class="accent">Above</span><span>the Noise</span></h1>
      <p class="sub">A community-driven token floating above the chaos.</p>
      <div class="actions">
        <a class="btn btn-primary" href="#buy">Buy NOVA →</a>
        <a class="btn btn-join glass" href="#community">Join Community</a>
      </div>
      <span class="badge glass">+12K Holders</span>
    </section>

    <img class="mist" src="mist.webp" alt="" aria-hidden="true">
    <img class="island" src="layer-island.png" alt="Floating island with a glass staircase leading to a glowing portal" width="992" height="973">
  </main>
</body>
</html>
